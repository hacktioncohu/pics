<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <g transform="translate(160, 160)">
    <!-- Külső gyűrű: 12 óra és 3 óra között nyitott -->
    <path d="M 133 -23 A 135 135 0 1 1 23 -133" fill="none" stroke="url(#cyberGrad)" stroke-width="12" stroke-linecap="butt" />

    <!-- Klasszikus ívelt szárak -->
    <path d="M -48 -86 A 96 96 0 0 0 -48 86" fill="none" stroke="url(#cyberGrad)" stroke-width="26" />
    <path d="M 48 -86 A 96 96 0 0 1 48 86" fill="none" stroke="url(#cyberGrad)" stroke-width="26" />

    <!-- Középső >_ szimbólum -->
    <polyline points="-42,-28 -8,0 -42,28" fill="none" stroke="#00f2fe" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="6" y1="24" x2="46" y2="24" stroke="#f8fafc" stroke-width="12" stroke-linecap="round" />
  </g>
</svg>