<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Sötétkék háttér (a honlap stílusában) -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#111625" />
      <stop offset="100%" stop-color="#080b12" />
    </radialGradient>

    <!-- Cián - Lila fő gradiens -->
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Neon ragyogás -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Háttér -->
  <rect width="400" height="400" fill="url(#bgGrad)" />

  <!-- EMBLÉMA KÖZÉPRE IGAZÍTVA -->
  <g transform="translate(200, 200)" filter="url(#glow)">
    <!-- Külső gyűrű: 12 óra és 3 óra között nyitott -->
    <path d="M 133 -23 A 135 135 0 1 1 23 -133" fill="none" stroke="url(#cyberGrad)" stroke-width="12" stroke-linecap="butt" />

    <!-- Klasszikus ívelt szárak -->
    <path d="M -48 -86 A 96 96 0 0 0 -48 86" fill="none" stroke="url(#cyberGrad)" stroke-width="26" />
    <path d="M 48 -86 A 96 96 0 0 1 48 86" fill="none" stroke="url(#cyberGrad)" stroke-width="26" />

    <!-- Középső >_ szimbólum -->
    <polyline points="-42,-28 -8,0 -42,28" fill="none" stroke="#00f2fe" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="6" y1="24" x2="46" y2="24" stroke="#f8fafc" stroke-width="12" stroke-linecap="round" />
  </g>
</svg>